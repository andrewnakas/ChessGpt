[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/chessgpt/chessgpt"
rust-version = "1.98"

[workspace.dependencies]
shakmaty = "0.30"
pgn-reader = "0.29"

tokio = { version = "1.53", features = ["full"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "query", "form", "http2", "charset", "system-proxy"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
schemars = "1.2"
ts-rs = { version = "12", features = ["serde-json-impl"] }
rust-embed = "8"
mime_guess = "2"
eventsource-stream = "0.2"
async-trait = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }
lru = "0.16"
regex = "1"
jsonschema = { version = "0.33", default-features = false }
insta = { version = "1", features = ["json"] }
wiremock = "0.6"

chess-core = { path = "crates/chess-core" }
engine = { path = "crates/engine" }
llm = { path = "crates/llm" }
coach = { path = "crates/coach" }
importers = { path = "crates/importers" }
db = { path = "crates/db" }
api-types = { path = "crates/api-types" }

[profile.release]
lto = "thin"

[profile.dev]
# Keeps target/ from growing to tens of GB; backtraces still have line numbers.
debug = "line-tables-only"
