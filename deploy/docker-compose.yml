services:
  chessgpt:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      CHESSGPT_MODE: hosted
      CHESSGPT_PUBLIC_URL: https://${CHESSGPT_DOMAIN:-chessgpt.com}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CHESSGPT_LLM_MODEL: ${CHESSGPT_LLM_MODEL:-}
      CHESSGPT_LLM_DAILY_TOKENS: ${CHESSGPT_LLM_DAILY_TOKENS:-}
      CHESSGPT_OPENAI_CHALLENGE: ${CHESSGPT_OPENAI_CHALLENGE:-}
      ENGINE_WORKERS: ${ENGINE_WORKERS:-2}
      ENGINE_THREADS: ${ENGINE_THREADS:-2}
    volumes:
      - chessgpt-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CHESSGPT_DOMAIN: ${CHESSGPT_DOMAIN:-chessgpt.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - chessgpt

volumes:
  chessgpt-data:
  caddy-data:
